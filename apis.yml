- aid: insurance-council-australia:mcp-adapter
  name: Insurance Council of Australia WordPress MCP Adapter (gated)
  description: A WordPress MCP adapter server route is registered on the ICA estate
    in the mcp namespace, alongside a wp-abilities/v1 namespace. Namespace discovery
    at /wp-json/mcp returns HTTP 200 and lists the adapter endpoint with POST, GET
    and DELETE methods, but an anonymous JSON-RPC initialize or tools/list returns
    HTTP 401 rest_forbidden. The surface genuinely exists and is genuinely not
    publicly usable — no tool names, descriptions or input schemas can be read
    without a WordPress credential the ICA issues to no third party, and none are
    published in documentation. Recorded as a gated surface rather than a product.
  humanURL: https://insurancecouncil.com.au/wp-json/mcp
  baseURL: https://insurancecouncil.com.au/wp-json/mcp/mcp-adapter-default-server
  tags:
  - MCP
  - Agents
  - WordPress
  - Gated
  properties:
  - type: MCPServer
    url: mcp/insurance-council-australia-mcp.yml
  - type: Discovery
    url: https://insurancecouncil.com.au/wp-json/mcp
- aid: insurance-council-australia:news-rss-feed
  name: Insurance Council of Australia News RSS Feed
  description: The ICA publishes its news, media releases, catastrophe declarations
    and resource updates as a standard RSS 2.0 feed at /feed/, served as
    application/rss+xml. This is the only first-party machine-readable syndication
    surface the organisation advertises, and it is read-only, unauthenticated and
    undocumented beyond the WordPress default.
  humanURL: https://insurancecouncil.com.au/news-hub/
  baseURL: https://insurancecouncil.com.au
