name: Insurance Council of Australia
kind: company
description: >-
  The Insurance Council of Australia (ICA) is the representative body for
  Australia's general insurance industry, whose members write approximately 90% of
  total premium income for private sector general insurers and reinsurers, spanning
  home and contents, motor, travel, liability, professional indemnity, commercial
  property and directors and officers lines. The ICA administers the General Insurance
  Code of Practice, issues catastrophe and significant event declarations, operates
  the member Data Hub that reports claim counts, incurred losses and closed rates
  for declared events, and advocates on resilience, climate risk, building standards
  and insurance affordability. It is a market body rather than a carrier — it sells
  no policies and exposes no quote, bind, issue or FNOL API. Its API posture is
  partner-gated with no public developer program: developer, developers, docs and
  api subdomains do not resolve, and /developers/, /developer/, /partners/ and
  /integrations/ all return 404. The only integration surface is the member portal
  at memberportal.insurancecouncil.com.au, an Azure AD B2C (OpenID Connect
  authorization code) login wall for member insurers. Catastrophe and resilience
  data is published as PDF reports and a downloadable XLSX master file rather than
  through an API, and no ACORD, AL3 or NGDS reference appears anywhere on the site —
  Australia's insurance data seam is the Consumer Data Right, which was designated
  for general insurance and then deferred.
