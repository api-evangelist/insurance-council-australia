apis:
- aid: insurance-council-australia:wordpress-rest-api
  name: Insurance Council of Australia WordPress REST API
  description: insurancecouncil.com.au runs on WordPress and leaves the standard
    WordPress REST API reachable anonymously at /wp-json/, returning JSON for pages,
    media (the PDF publication corpus of media releases, submissions and reports),
    categories, tags and site search. This is incidental CMS infrastructure rather
    than an ICA API product — the ICA publishes no documentation for it, /wp/v2/posts
    returns an empty array, /wp/v2/users returns 401, and the insurer, resource and
    insurance-type custom post types behind Find an Insurer are not registered with
    the REST API (that directory is served by wp-admin/admin-ajax.php instead). It
    carries no insurance data model, no quote, bind, issue or FNOL operations, and
    no authentication for the read paths.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://insurancecouncil.com.au/wp-json/wp/v2
