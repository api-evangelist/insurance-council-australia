insurance_entities:
  present: false
  note: |
    No policy, quote, risk, claim, catastrophe, event, insurer or code-subscriber
    entity is exposed anywhere in the machine-readable surface. The catastrophe
    dataset ICA does publish is an XLSX download, and the Data Hub figures are
    rendered server-side as HTML.
