method: derived
source: |
  json-schema/insurance-council-australia-wp-v2-*.json (harvested by HTTP OPTIONS)
  plus GET /wp-json/wp/v2/types and GET /wp-json/wp/v2/taxonomies, 2026-07-25
note: |
  There is no insurance data model exposed by the Insurance Council of Australia.
  This entity graph is derived strictly from the resource schemas the incidental
  WordPress REST API publishes, and it is a content-management model: pages, media
  attachments, taxonomy terms and site metadata. The insurance-bearing custom post
  types the site actually runs on — insurer, resource, ins-type, ins-topic,
  campaign — are registered in WordPress but NOT registered with the REST API, and
  therefore have no machine-readable schema. That absence is the substantive finding.
rest_registered_types:
- name: page
  rest_base: pages
  schema: json-schema/insurance-council-australia-wp-v2-pages.json
  records_observed: 124
- name: attachment
  rest_base: media
  schema: json-schema/insurance-council-australia-wp-v2-media.json
  note: The PDF publication corpus (media releases, submissions, ICA reports) is
    exposed here.
- name: post
  rest_base: posts
  note: Registered but returns an empty collection — ICA editorial content does not
    live in the core post type.
- name: comment
  rest_base: comments
  schema: json-schema/insurance-council-australia-wp-v2-comments.json
- name: elementor_library
  rest_base: elementor_library
  note: Page-builder template store, not content.
- name: elementor_snippet
  rest_base: elementor_snippet
