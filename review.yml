actions:
  openapiHarvested: false
  openapiDirectoryCreated: false
  reason: |
    No OpenAPI, Swagger, GraphQL SDL, .proto or AsyncAPI artifact exists to
    harvest. Per the no-fabrication rule the openapi/ directory was omitted
    entirely rather than seeded with an invented specification.
  apisYmlEntries: 2
  apisYmlNote: |
    Only the two genuinely live, anonymously reachable surfaces are listed — the
    incidental WordPress REST API and the RSS feed — each described as incidental
    CMS infrastructure rather than an ICA API product. This follows existing
    api-evangelist network precedent for WordPress-backed organisations. The
    correct read of this record is a standards-and-documentation market body with
    no public self-serve API and a member-gated integration surface.
