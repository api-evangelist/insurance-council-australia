aid: insurance-council-australia
name: Insurance Council of Australia
review:
  question: Does the Insurance Council of Australia publish a public, self-serve
    developer portal or any documented insurance API (quote, bind, issue, FNOL, or a
    public register/statistics API)?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: market-infrastructure
  gated: true
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    The Insurance Council of Australia is the representative body for the general
    insurance industry in Australia — its members write approximately 90% of total
    premium income for private sector general insurers and reinsurers. It is a
    market body, not a carrier: it administers the General Insurance Code of
    Practice, declares catastrophes and significant events, runs a member Data Hub,
    and advocates on resilience and affordability.

    There is NO first-party developer portal. Every candidate host and path was
    probed on 2026-07-25 and none resolved to a developer surface. The only
    integration surface is the member portal, which is an Azure AD B2C login wall
    for member insurers — a partner/member gate, not a developer portal.

    No OpenAPI, Swagger, GraphQL, gRPC, AsyncAPI, Postman collection, webhook or
    event catalogue was found. Zero specifications were harvested, and the
    openapi/ directory was deliberately omitted because nothing real exists.

    Two incidental machine-readable surfaces DO respond anonymously and are
    recorded honestly rather than dressed up as an API program: the standard
    WordPress REST API left reachable at /wp-json/ (the site runs WordPress on
    WP Engine with Elementor), and the standard WordPress RSS feed at /feed/.
    Neither is documented by the ICA, and neither carries an insurance data model.

    Notably, a WordPress MCP adapter route is registered at
    /wp-json/mcp/mcp-adapter-default-server (POST, GET, DELETE) alongside a
    wp-abilities/v1 namespace, but it returns 401 rest_forbidden to anonymous
    JSON-RPC initialize — an MCP surface exists on the estate and is not public.

    ICA's catastrophe and resilience data — the one genuinely valuable data asset
    a market body of this kind holds — is published as HTML dashboards, PDF
    reports and a downloadable XLSX master file, not through an API.
