  acordPosture:
    phrase: no ACORD reference found
    evidence: |
      The site's own WordPress search endpoint (/wp-json/wp/v2/search) was queried
      on 2026-07-25 for "ACORD", "AL3" and "NGDS" and each returned an empty array.
      No ACORD XML, ACORD AL3, ACORD certification, NGDS or ACORD API reference
      appears anywhere on insurancecouncil.com.au. This is consistent with the
      Australian market: ACORD's flat-file and XML transports are an Anglo-American
      broker/agency convention (IVANS agency download, Applied Epic, Vertafore
      AMS360), and Australia's general insurance data seam is instead the Consumer
      Data Right, which was designated to extend to general insurance and then
      deferred and de-prioritised — so no live open-insurance obligation exists.
    ivansOrAgencyDownload: not applicable — Australian market, no IVANS presence
      referenced
  insuranceVerbs:
    quote: false
    bind: false
    issue: false
    fnol: false
    note: |
      None of the four insurance API verbs are exposed. The ICA is a market body
      that writes no policies and handles no claims; claims data reaches it as
      member data submissions through the gated member portal / Data Hub, not
      through a published API. Catastrophe declaration itself is a bulletin
      published as HTML and PDF, with no machine-readable declaration feed beyond
      the site's generic RSS.
  authModel:
    public:
      scheme: none
      note: The WordPress REST read paths and the RSS feed are anonymous and
        unauthenticated. No API key, token or registration exists or is offered.
    memberGate:
      scheme: OAuth2 / OpenID Connect authorization code (Azure AD B2C)
      confirmed: true
      wellKnown: https://icab2cprod.b2clogin.com/04c7fa07-b168-495f-9dcc-bcfceb1a274e/b2c_1_signin/v2.0/.well-known/openid-configuration
      wellKnownStatus: 200
      issuer: https://icab2cprod.b2clogin.com/tfp/04c7fa07-b168-495f-9dcc-bcfceb1a274e/b2c_1_signin/v2.0/
      authorizationEndpoint: https://icab2cprod.b2clogin.com/04c7fa07-b168-495f-9dcc-bcfceb1a274e/b2c_1_signin/oauth2/v2.0/authorize
      tokenEndpoint: https://icab2cprod.b2clogin.com/04c7fa07-b168-495f-9dcc-bcfceb1a274e/b2c_1_signin/oauth2/v2.0/token
      jwksUri: https://icab2cprod.b2clogin.com/04c7fa07-b168-495f-9dcc-bcfceb1a274e/b2c_1_signin/discovery/v2.0/keys
      scopesSupported:
      - openid
      idTokenSigningAlg:
      - RS256
      note: |
        This is a human sign-in flow for member insurers into a members-only
        portal, not a machine-to-machine API authorization server. There is no
        client-credentials grant offered to third parties, no scope catalogue
        beyond openid, and no published client registration path.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://insurancecouncil.com.au/wp-json/wp/v2
    documented: false
    note: |
      Standard WordPress REST API, reachable anonymously. Root discovery document
      at /wp-json/ returned HTTP 200 with 420 registered routes across 28
      namespaces. Confirmed anonymous reads: /wp/v2/pages 200, /wp/v2/media 200
      (PDF publication corpus), /wp/v2/search 200, /wp/v2/categories 200,
      /wp/v2/types 200. Confirmed restricted: /wp/v2/users 401. /wp/v2/posts
      returns an empty array — ICA content lives in custom post types (insurer,
      resource, ins-type, ins-topic, campaign) which are NOT registered with the
      REST API. Incidental CMS surface; not an ICA API product.
  - protocol: RSS
    scheme: https
    baseURL: https://insurancecouncil.com.au/feed/
    documented: false
    note: HTTP 200, content-type application/rss+xml. WordPress default feed.
  - protocol: MCP
    scheme: https
    baseURL: https://insurancecouncil.com.au/wp-json/mcp/mcp-adapter-default-server
    documented: false
    gated: true
    note: |
      A WordPress MCP adapter is registered (methods POST, GET, DELETE) alongside a
      wp-abilities/v1 namespace. An anonymous JSON-RPC initialize
      (protocolVersion 2025-06-18) returned HTTP 401
      {"code":"rest_forbidden","message":"Sorry, you are not allowed to do that."}.
      The surface exists on the estate but is not publicly usable.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface found; no SDL introspected.
  - protocol: gRPC
    documented: false
    note: No published .proto artifacts found.
  - protocol: WebSocket
    documented: false
    note: No WebSocket or streaming endpoint documented or discovered.
  webhooks:
    exists: false
    asyncapi: false
    note: |
      No event catalogue, webhook documentation or AsyncAPI document exists. There
      is no machine-readable catastrophe-declaration event stream, which is the one
      event a market body of this kind would plausibly publish — declarations are
      released as web pages, media releases and PDFs. Absence is the finding.
  postman:
    exists: false
    note: No public Postman collection or workspace found for the organisation.
  sdks:
    exists: false
    note: No SDKs, client libraries, CLI or GitHub organisation found.
  publishedArtifacts:
    note: |
      As a market body, ICA's real published corpus is documents and datasets
      rather than APIs. These are the genuine machine-readable or bulk-downloadable
      artifacts confirmed live on 2026-07-25.
    items:
    - name: ICA Historical Normalised Catastrophe Master (June 2026)
      url: https://insurancecouncil.com.au/wp-content/uploads/2026/07/ICA-Historical-Normalised-Catastrophe-Master-Updated-2026_06.xlsx
      status: 200
      contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      bytes: 273633
      note: |
        Bulk XLSX download of normalised Australian natural-hazard catastrophe
        losses. ICA states its catastrophe records date back to 1967. This is the
        organisation's flagship data asset and it is a spreadsheet, not an API.
    - name: ICA Data Hub
      url: https://insurancecouncil.com.au/industry-members/data-hub/
      status: 200
      note: |
        Public HTML dashboard reporting per-event claim count, claims incurred,
        outstanding and closed rate for declared catastrophes and significant
        events (e.g. Significant Event 264 Queensland flooding: 3.04k claims,
        $43.9m incurred, 33.4% closed). Rendered server-side through Elementor —
        no JSON endpoint, no Power BI/Tableau embed, no downloadable feed behind
        the figures.
    - name: Current catastrophes and significant event declarations
      url: https://insurancecouncil.com.au/news-hub/current-catastrophes/
      status: 200
      note: HTML bulletin pages per declaration; no machine-readable feed.
    - name: General Insurance Code of Practice
      url: https://insurancecouncil.com.au/code-of-practice/
      status: 200
      note: |
        The rulebook ICA administers, published as web pages and PDF, with code
        subscribers, past codes and consultation submissions. Independent code
        review runs at codeofpracticereview.com.au. No machine-readable rule
        corpus.
    - name: ICA Reports
      url: https://insurancecouncil.com.au/ica-reports/
      status: 200
      note: PDF report library (Insurance Catastrophe Resilience Report, Climate
        Change Impact Series, Fact Pack, election platform).
    - name: Find an Insurer
      url: https://insurancecouncil.com.au/find-an-insurer/
      status: 200
      note: |
        Public register-like directory of general insurers and the product
        categories they offer (also at findaninsurer.com.au, which 301s here). The
        closest thing ICA has to a public register API — but it is served by
        wp-admin/admin-ajax.php (postgrid_ajax_load) behind a nonce, its insurer
        custom post type is not REST-registered, and no documented query interface
        is offered. Explicitly framed as a directory, not a comparison service.
